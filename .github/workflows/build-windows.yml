name: Build Windows

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # pnpm 11 uses node:sqlite and refuses to start on anything below 22.13.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # build.rs uses upx to shrink the freshly-downloaded ffmpeg/ffprobe
      # sidecars; its absence is tolerated (see build.rs), this just keeps
      # ad-hoc Windows test builds the same size as the real release ones.
      - name: Install upx
        run: choco install upx -y
        shell: bash

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v3-ggml-msvc-cl-o2
          workspaces: src-tauri

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      # autocut.exe imports MSVCP140*.dll (C++ runtime, via onnxruntime) and
      # PCs without the VC++ Redistributable refuse to start it. Copy the
      # runner's runtime DLLs; tauri.windows.conf.json installs them next to
      # the exe (Microsoft-supported app-local deployment).
      - name: Stage VC++ runtime DLLs
        shell: bash
        run: |
          mkdir -p src-tauri/vcrt
          for f in msvcp140 msvcp140_1 msvcp140_2 vcruntime140 vcruntime140_1; do
            cp "/c/Windows/System32/$f.dll" src-tauri/vcrt/
          done
          ls -l src-tauri/vcrt

      - name: Tauri build
        env:
          # ggml defaults to -march=native, which bakes the CI runner's AVX-512
          # into the binary and crashes with SIGILL on ordinary laptops. OFF
          # pins a portable AVX2/FMA/F16C baseline instead.
          GGML_NATIVE: 'OFF'
          # cmake-rs (0.1.58) strips -O/ /O from CFLAGS for MSVC; CL is read by
          # cl.exe itself, so -O2 still reaches ggml. Benched as a no-op (48.4s vs
          # 46.6s), kept as harmless. It did NOT cause the slow user-laptop runs:
          # CI Windows is within ~15% of Linux (41.8s vs 36.4s). Dash form: Git
          # Bash rewrites "/O2" into a path.
          CL: '-O2'
        # NSIS only, matching release.yml: the default "all" would also build
        # an MSI, a second ~600MB installer of the same payload.
        run: node_modules/.bin/tauri build --bundles nsis
        shell: bash

      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autocut-windows-x86_64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/autocut.exe
          if-no-files-found: warn
