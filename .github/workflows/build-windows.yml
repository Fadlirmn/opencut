name: Build Windows

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # pnpm 11 uses node:sqlite and refuses to start on anything below 22.13.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # build.rs uses upx to shrink the freshly-downloaded ffmpeg/ffprobe
      # sidecars; its absence is tolerated (see build.rs), this just keeps
      # ad-hoc Windows test builds the same size as the real release ones.
      - name: Install upx
        run: choco install upx -y
        shell: bash

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-ggml-msvc-o2
          workspaces: src-tauri

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Tauri build
        env:
          # ggml defaults to -march=native, which bakes the CI runner's AVX-512
          # into the binary and crashes with SIGILL on ordinary laptops. OFF
          # pins a portable AVX2/FMA/F16C baseline instead.
          GGML_NATIVE: 'OFF'
          # cmake-rs hands MSVC its own CMAKE_C_FLAGS_RELEASE with no /O2, so
          # ggml/whisper.cpp would be compiled unoptimized (~9x slower than
          # the Linux build). The target-scoped vars reach only MSVC builds.
          CFLAGS_x86_64_pc_windows_msvc: '-O2'
          CXXFLAGS_x86_64_pc_windows_msvc: '-O2'
        # NSIS only, matching release.yml: the default "all" would also build
        # an MSI, a second ~600MB installer of the same payload.
        run: node_modules/.bin/tauri build --bundles nsis
        shell: bash

      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autocut-windows-x86_64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/autocut.exe
          if-no-files-found: warn
