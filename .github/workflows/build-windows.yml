name: Build Windows

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # pnpm 11 uses node:sqlite and refuses to start on anything below 22.13.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # build.rs uses upx to shrink the freshly-downloaded ffmpeg/ffprobe
      # sidecars; its absence is tolerated (see build.rs), this just keeps
      # ad-hoc Windows test builds the same size as the real release ones.
      - name: Install upx
        run: choco install upx -y
        shell: bash

      # whisper-rs's `vulkan` feature needs the Vulkan SDK (headers + glslc).
      - name: Install Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader, SPIRV-Tools, Glslang
          vulkan-use-cache: true

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Tauri build
        run: node_modules/.bin/tauri build
        shell: bash

      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autocut-windows-x86_64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/autocut.exe
          if-no-files-found: warn
