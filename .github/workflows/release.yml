name: Release

# Tag push is the only trigger: pushing `vX.Y.Z` builds every platform and
# collects the installers into a draft release. Nothing here publishes on its
# own — the draft is the checkpoint where the .dmg gets opened and launched
# once before real users can download it.
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      # One platform failing shouldn't throw away a 10-minute build of the
      # other — the release job checks what actually arrived.
      fail-fast: false
      matrix:
        include:
          # macos-14 is arm64, so the host target is aarch64-apple-darwin and
          # Tauri names the disk image autocut_<version>_aarch64.dmg. That
          # exact name is what the Homebrew cask URL interpolates.
          - os: macos-14
            artifact: autocut-macos-aarch64
            bundles: |
              src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            artifact: autocut-windows-x86_64
            bundles: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          # rpmbuild isn't preinstalled on ubuntu-latest, so this skips the
          # rpm target rather than fail on it; dpkg-deb is already on the
          # image, so deb comes along for free alongside the AppImage.
          - os: ubuntu-latest
            artifact: autocut-linux-x86_64
            bundleTargets: appimage,deb
            bundles: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # pnpm 11 uses node:sqlite and refuses to start on anything below 22.13.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Same package list ci.yml already proved sufficient for a Tauri 2
      # Linux build (webkit2gtk-4.1, not the older 4.0 package names). upx
      # is what build.rs uses to shrink the freshly-downloaded ffmpeg/
      # ffprobe sidecars; its absence is tolerated (see build.rs), so this
      # not being on every platform is fine — just leaves that leg's
      # sidecars uncompressed.
      - name: System dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev upx-ucl

      # UPX's Mach-O support is unreliable and risks breaking codesigning, so
      # build.rs never packs on macOS — nothing to install here.
      - name: Install upx
        if: matrix.os == 'windows-latest'
        run: choco install upx -y
        shell: bash

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Debug artifacts from CI would be dead weight and can't be reused by
          # an optimized build anyway.
          key: release-${{ matrix.os }}

      # Frozen, unlike the ad-hoc build-windows workflow: a release must build
      # from exactly the dependency set the lockfile records, and an install
      # that quietly rewrites it means the shipped binary isn't the one CI
      # tested.
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # The tag is the version users see in the filename and in the cask, while
      # diagnostic_info reports the crate version. If they disagree, bug reports
      # point at a build that doesn't exist. CI already pins package.json to
      # Cargo.toml, so checking the tag against one of them covers all three.
      - name: Tag matches manifest version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag is v$tag but package.json says $pkg"
            exit 1
          fi
          echo "releasing $pkg"

      # No AUTOCUT_STUB_SIDECARS/AUTOCUT_STUB_MODEL here, deliberately:
      # build.rs downloads the real ffmpeg/ffprobe pair and whisper model,
      # and a bundle built with stubs would install cleanly and then fail on
      # the first video. Linux passes --bundles explicitly to skip rpm
      # (no rpmbuild on the runner); macOS/Windows build their defaults.
      - name: Tauri build
        env:
          # whisper.cpp uses std::filesystem, which needs macOS >= 10.15.
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          if [ -n "${{ matrix.bundleTargets }}" ]; then
            node_modules/.bin/tauri build --bundles ${{ matrix.bundleTargets }}
          else
            node_modules/.bin/tauri build
          fi
        shell: bash

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  release:
    needs: build
    # Skipped platforms are tolerated above, so this still runs when one leg
    # failed — better to get a partial draft than nothing.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # merge-multiple merges the artifact *names* into one directory but keeps
      # each artifact's own internal layout. The Windows and Linux legs each
      # declare two path patterns, so their installers arrive nested (e.g.
      # artifacts/msi/*.msi and artifacts/nsis/*.exe), while the single-
      # pattern macOS dmg lands flat. A plain artifacts/* therefore hands
      # `gh release upload` a directory and it fails with "is a directory".
      # Flatten to files first.
      - name: Flatten
        run: |
          set -euo pipefail
          mkdir -p installers
          find artifacts -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec mv -t installers {} +
          ls -la installers

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Re-runs are the normal case, not the exception: one platform fails,
          # you fix it and move the tag, and by then the draft from the first
          # attempt already exists. Create it once, then upload over whatever is
          # there. --generate-notes only seeds the body with a commit list; the
          # human-facing changelog is written over it before publishing.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists, refreshing its assets"
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" installers/* --clobber

      # The build matrix tolerates one platform failing so the other's artifacts
      # survive, which means a draft can end up holding only part of a release.
      # It looks complete in the UI, and a macOS-only release is exactly the
      # sort of thing that gets published by accident. Leave the draft in
      # place — the assets are still worth having — but keep the run red.
      - name: All platforms present
        run: |
          set -euo pipefail
          missing=""
          for pattern in "*.dmg" "*.msi" "*-setup.exe" "*.AppImage" "*.deb"; do
            if ! compgen -G "installers/$pattern" > /dev/null; then
              missing="$missing $pattern"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::draft $GITHUB_REF_NAME is incomplete, missing:$missing"
            exit 1
          fi
          echo "all five installers present"
