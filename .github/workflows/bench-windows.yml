name: Bench Windows whisper

# Builds only the whisper benchmark example with the exact toolchain and
# flags of the Windows release (MSVC, GGML_NATIVE=OFF), so its speed can be
# compared against the Linux build on the same machine.
on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-ggml-msvc-o2
          workspaces: src-tauri

      - name: Build bench example
        env:
          GGML_NATIVE: 'OFF'
          # cmake-rs hands MSVC its own CMAKE_C_FLAGS_RELEASE with no /O2, so
          # ggml/whisper.cpp would be compiled unoptimized (~9x slower than
          # the Linux build). The target-scoped vars reach only MSVC builds.
          CFLAGS_x86_64_pc_windows_msvc: '/O2'
          CXXFLAGS_x86_64_pc_windows_msvc: '/O2'
          AUTOCUT_STUB_SIDECARS: '1'
        working-directory: src-tauri
        shell: bash
        # Full log goes to a file; only the SIMD/build-type lines are echoed.
        # (Piping cargo into a truncating filter kills it before it finishes.)
        run: |
          # tauri::generate_context! needs frontendDist to exist; the bench
          # never shows a window, so an empty placeholder is enough.
          mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html
          cargo build --release --example bench_whisper -vv > build.log 2>&1
          status=$?
          grep -aoE "/arch:[A-Z0-9.]+|GGML_(AVX|AVX2|FMA|F16C|NATIVE|AVX512)[A-Z_]*[:=][A-Z]+|CMAKE_BUILD_TYPE[:=][A-Za-z]+|-- CMAKE_C_COMPILER_ID[^\r]*|Finished[^\r]*" build.log | sort | uniq -c
          exit $status

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-build-log
          path: src-tauri/build.log

      - name: Upload bench exe
        uses: actions/upload-artifact@v4
        with:
          name: bench-whisper-windows
          path: src-tauri/target/release/examples/bench_whisper.exe
          if-no-files-found: error
