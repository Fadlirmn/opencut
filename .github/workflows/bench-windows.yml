name: Bench Windows whisper

# Builds only the whisper benchmark example with the exact toolchain and
# flags of the Windows release (MSVC, GGML_NATIVE=OFF), so its speed can be
# compared against the Linux build on the same machine.
on:
  workflow_dispatch:
    inputs:
      cl:
        description: 'CL env for cl.exe (empty = unoptimized baseline)'
        default: '-O2'

jobs:
  bench:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v3-ggml-msvc-cl${{ inputs.cl }}
          workspaces: src-tauri

      - name: Build bench example
        env:
          GGML_NATIVE: 'OFF'
          # cmake-rs (0.1.58) overrides CMAKE_C_FLAGS_RELEASE for MSVC and
          # strips every -O/ /O flag from CFLAGS, so ggml/whisper.cpp was built
          # with no optimization (~9x slower than Linux). CL is read by cl.exe
          # itself, bypassing cmake-rs. Dash form: Git Bash rewrites "/O2"
          # into a path.
          CL: ${{ inputs.cl }}
          AUTOCUT_STUB_SIDECARS: '1'
        working-directory: src-tauri
        shell: bash
        # Full log goes to a file; only the SIMD/build-type lines are echoed.
        # (Piping cargo into a truncating filter kills it before it finishes.)
        run: |
          # tauri::generate_context! needs frontendDist to exist; the bench
          # never shows a window, so an empty placeholder is enough.
          mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html
          cargo build --release --example bench_whisper -vv > build.log 2>&1
          status=$?
          grep -aoE "/arch:[A-Z0-9.]+|GGML_(AVX|AVX2|FMA|F16C|NATIVE|AVX512)[A-Z_]*[:=][A-Z]+|CMAKE_BUILD_TYPE[:=][A-Za-z]+|-- CMAKE_C_COMPILER_ID[^\r]*|Finished[^\r]*" build.log | sort | uniq -c
          exit $status

      # Run the bench on a synthetic 20s clip with the real app model. The
      # time only matters relative to a build without -O2 (several x slower).
      # cl.exe reads CL itself, so -O2 never shows on the logged compile line;
      # this timing is the evidence that it took effect.
      - name: Run bench
        shell: bash
        working-directory: src-tauri
        run: |
          curl -sSL -o model.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin
          python -c "import math,struct,sys; sys.stdout.buffer.write(b''.join(struct.pack('<h', int(8000*math.sin(2*math.pi*440*i/16000))) for i in range(16000*20)))" > audio.s16le
          ./target/release/examples/bench_whisper.exe audio.s16le model.bin

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-build-log
          path: src-tauri/build.log

      - name: Upload bench exe
        uses: actions/upload-artifact@v4
        with:
          name: bench-whisper-windows
          path: src-tauri/target/release/examples/bench_whisper.exe
          if-no-files-found: error
