name: Bench Windows whisper

# Builds only the whisper benchmark example with the exact toolchain and
# flags of the Windows release (MSVC, GGML_NATIVE=OFF), so its speed can be
# compared against the Linux build on the same machine.
on:
  workflow_dispatch:
    inputs:
      cl:
        description: 'CL env for cl.exe (empty = unoptimized baseline)'
        default: '-O2'

jobs:
  bench:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v3-ggml-msvc-cl${{ inputs.cl }}
          workspaces: src-tauri

      - name: Build bench example
        env:
          GGML_NATIVE: 'OFF'
          # cmake-rs (0.1.58) strips -O/ /O from CFLAGS for MSVC; CL is read by
          # cl.exe itself, so -O2 still reaches ggml. Benched as a no-op (48.4s vs
          # 46.6s), kept as harmless. It did NOT cause the slow user-laptop runs:
          # CI Windows is within ~15% of Linux (41.8s vs 36.4s). Dash form: Git
          # Bash rewrites "/O2" into a path.
          CL: ${{ inputs.cl }}
          AUTOCUT_STUB_SIDECARS: '1'
        working-directory: src-tauri
        shell: bash
        # Full log goes to a file; only the SIMD/build-type lines are echoed.
        # (Piping cargo into a truncating filter kills it before it finishes.)
        run: |
          # tauri::generate_context! needs frontendDist to exist; the bench
          # never shows a window, so an empty placeholder is enough.
          mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html
          cargo build --release --example bench_whisper -vv > build.log 2>&1
          status=$?
          grep -aoE "/arch:[A-Z0-9.]+|GGML_(AVX|AVX2|FMA|F16C|NATIVE|AVX512)[A-Z_]*[:=][A-Z]+|CMAKE_BUILD_TYPE[:=][A-Za-z]+|-- CMAKE_C_COMPILER_ID[^\r]*|Finished[^\r]*" build.log | sort | uniq -c
          exit $status

      # Run the bench on a synthetic 20s clip with the real app model.
      # Compare against the bench-linux job below (same clip, same flags).
      - name: Run bench
        shell: bash
        working-directory: src-tauri
        run: |
          curl -sSL -o model.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin
          python -c "import math,struct,sys; sys.stdout.buffer.write(b''.join(struct.pack('<h', int(8000*math.sin(2*math.pi*440*i/16000))) for i in range(16000*20)))" > audio.s16le
          ./target/release/examples/bench_whisper.exe audio.s16le model.bin

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-build-log
          path: src-tauri/build.log

      - name: Upload bench exe
        uses: actions/upload-artifact@v4
        with:
          name: bench-whisper-windows
          path: src-tauri/target/release/examples/bench_whisper.exe
          if-no-files-found: error

  # Same bench on a Linux runner with the same vCPU count, so the Windows
  # number has a like-for-like reference.
  bench-linux:
    runs-on: ubuntu-latest
    env:
      AUTOCUT_STUB_SIDECARS: '1'
      GGML_NATIVE: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-bench-linux
          workspaces: src-tauri
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - name: Build bench example
        working-directory: src-tauri
        run: |
          mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html
          cargo build --release --example bench_whisper
      - name: Run bench
        working-directory: src-tauri
        run: |
          curl -sSL -o model.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin
          python3 -c "import math,struct,sys; sys.stdout.buffer.write(b''.join(struct.pack('<h', int(8000*math.sin(2*math.pi*440*i/16000))) for i in range(16000*20)))" > audio.s16le
          ./target/release/examples/bench_whisper audio.s16le model.bin
